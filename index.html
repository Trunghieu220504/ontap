<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ôn tập trắc nghiệm</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="app">
        <!-- Màn chọn môn -->
        <div id="screen-subjects" class="screen">
            <div class="container">
                <h1>Chọn môn học</h1>
                <div id="subjects-list"></div>
            </div>
        </div>

        <!-- Màn chọn chế độ -->
        <div id="screen-mode" class="screen hidden">
            <div class="container">
                <button id="btn-back-to-subjects" class="btn-secondary">← Đổi môn</button>
                <h1 id="mode-subject-name"></h1>
                <div class="mode-grid">
                    <button class="mode-btn" data-mode="all">
                        <div class="mode-title">Tất cả câu hỏi</div>
                        <div class="mode-desc" id="mode-all-desc"></div>
                    </button>
                    <button class="mode-btn" data-mode="chapters">
                        <div class="mode-title">Theo chương</div>
                        <div class="mode-desc" id="mode-chapters-desc"></div>
                    </button>
                    <button class="mode-btn" data-mode="sets">
                        <div class="mode-title">Theo đề 50 câu</div>
                        <div class="mode-desc" id="mode-sets-desc"></div>
                    </button>
                    <button class="mode-btn" data-mode="wrong">
                        <div class="mode-title">Câu đã làm sai</div>
                        <div class="mode-desc" id="mode-wrong-desc"></div>
                    </button>
                </div>
                <button id="btn-view-history" class="btn-secondary" style="margin-top: 20px">Xem lịch sử</button>
            </div>
        </div>

        <!-- Màn chọn chương -->
        <div id="screen-chapters" class="screen hidden">
            <div class="container">
                <div class="screen-top-bar">
                    <button id="btn-back-to-mode" class="btn-secondary">← Quay lại</button>
                </div>
                <h2>Chọn chương</h2>
                <div class="chapters-toolbar">
                    <div class="chapters-summary">
                        Đã chọn: <strong id="selected-chapters-count">0</strong>/<span id="total-chapters-count">0</span> chương (<strong id="selected-questions-count">0</strong> câu)
                    </div>
                    <div class="chapters-actions">
                        <button type="button" id="btn-select-all-chapters" class="btn-secondary btn-sm">Chọn tất cả</button>
                        <button type="button" id="btn-deselect-all-chapters" class="btn-secondary btn-sm">Bỏ chọn</button>
                    </div>
                </div>
                <div id="chapters-list" class="chapters-list"></div>
                <div class="chapters-footer">
                    <button id="btn-start-chapters" class="btn-primary btn-large">Bắt đầu</button>
                </div>
            </div>
        </div>

        <!-- Màn chọn đề -->
        <div id="screen-sets" class="screen hidden">
            <div class="container">
                <div class="screen-top-bar">
                    <button id="btn-back-to-mode-sets" class="btn-secondary">← Quay lại</button>
                </div>
                <h2>Chọn đề ôn tập</h2>
                <div class="sets-toolbar">
                    <label class="checkbox-label shuffle-checkbox-label">
                        <input type="checkbox" id="checkbox-shuffle-set">
                        <span>Xáo trộn thứ tự câu trong đề</span>
                    </label>
                </div>
                <div id="sets-list" class="sets-grid"></div>
            </div>
        </div>

        <!-- Màn cấu hình thời gian -->
        <div id="screen-time-config" class="screen hidden">
            <div class="container">
                <h2>Cấu hình bài thi</h2>
                <p id="time-info"></p>

                <div class="config-section">
                    <div class="config-section-title">⏱ Thời gian</div>
                    <label class="checkbox-label">
                        <input type="checkbox" id="checkbox-unlimited-time">
                        Không giới hạn thời gian
                    </label>
                </div>

                <div class="config-section">
                    <div class="config-section-title">📋 Chế độ hiển thị đáp án</div>
                    <div class="answer-mode-group">
                        <label class="answer-mode-option" id="label-mode-instant">
                            <input type="radio" name="answer-mode" id="radio-mode-instant" value="instant" checked>
                            <div class="answer-mode-card">
                                <div class="answer-mode-icon">✅</div>
                                <div class="answer-mode-info">
                                    <div class="answer-mode-name">Hiện đáp án ngay</div>
                                    <div class="answer-mode-desc">Sau mỗi câu trả lời sẽ hiện đúng/sai luôn</div>
                                </div>
                            </div>
                        </label>
                        <label class="answer-mode-option" id="label-mode-exam">
                            <input type="radio" name="answer-mode" id="radio-mode-exam" value="exam">
                            <div class="answer-mode-card">
                                <div class="answer-mode-icon">📝</div>
                                <div class="answer-mode-info">
                                    <div class="answer-mode-name">Chế độ thi</div>
                                    <div class="answer-mode-desc">Ẩn đáp án, chỉ hiện kết quả sau khi nộp bài</div>
                                </div>
                            </div>
                        </label>
                    </div>
                </div>

                <div style="margin-top: 24px; display: flex; gap: 12px;">
                    <button id="btn-start-quiz" class="btn-primary btn-large">Bắt đầu</button>
                    <button id="btn-cancel-quiz" class="btn-secondary">Huỷ</button>
                </div>
            </div>
        </div>

        <!-- Màn làm bài -->
        <div id="screen-quiz" class="screen hidden">
            <div class="quiz-header">
                <div class="quiz-info">
                    <span id="quiz-subject-name"></span>
                    <span id="quiz-mode-name"></span>
                </div>
                <div id="timer-display"></div>
            </div>
            <div class="container">
                <div id="question-navigation"></div>
                <div id="question-container">
                    <div class="question-header-bar">
                        <span class="exam-mode-indicator hidden" id="exam-mode-indicator">📝 Chế độ thi</span>
                        <span class="question-progress-badge" id="question-progress-badge"></span>
                    </div>
                    <div id="question-text"></div>
                    <div id="question-options"></div>
                    <button id="btn-hint" class="btn-secondary">Gợi ý</button>
                    <div id="hint-text" class="hidden"></div>
                    <div id="explanation-text" class="hidden"></div>
                </div>
                <div class="quiz-controls">
                    <button id="btn-prev" class="btn-secondary">← Câu trước</button>
                    <button id="btn-next" class="btn-secondary">Câu sau →</button>
                    <button id="btn-submit" class="btn-primary">Nộp bài</button>
                </div>
            </div>
        </div>

        <!-- Màn kết quả -->
        <div id="screen-result" class="screen hidden">
            <div class="container">
                <h1>Kết quả</h1>
                <div id="result-summary"></div>
                <div class="result-controls">
                    <label class="checkbox-label">
                        <input type="checkbox" id="checkbox-filter-wrong">
                        Chỉ xem câu sai
                    </label>
                </div>
                <div id="result-details"></div>
                <div style="margin-top: 20px">
                    <button id="btn-redo-wrong" class="btn-primary">Làm lại câu sai</button>
                    <button id="btn-back-to-mode-result" class="btn-secondary">Về màn hình chính</button>
                </div>
            </div>
        </div>

        <!-- Màn lịch sử -->
        <div id="screen-history" class="screen hidden">
            <div class="container">
                <button id="btn-back-from-history" class="btn-secondary">← Quay lại</button>
                <h1>Lịch sử làm bài</h1>
                <div class="history-controls">
                    <button id="btn-export-history" class="btn-secondary">Xuất lịch sử</button>
                    <button id="btn-import-history" class="btn-secondary">Nhập lịch sử</button>
                    <input type="file" id="file-import-history" accept=".json" class="hidden">
                    <button id="btn-clear-history" class="btn-danger">Xoá toàn bộ</button>
                </div>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- Màn xem chi tiết lịch sử -->
        <div id="screen-history-detail" class="screen hidden">
            <div class="container">
                <button id="btn-back-to-history" class="btn-secondary">← Quay lại</button>
                <h2>Chi tiết bài làm</h2>
                <div id="history-detail-summary"></div>
                <div id="history-detail-questions"></div>
                <button id="btn-delete-history-item" class="btn-danger">Xoá bài làm này</button>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
